# Local and public-VPS deployment: app + Postgres + Redis (+ Caddy on a VPS).
# Production (the home server) uses its own compose.yaml with cloudflared; see AGENTS.md.
#   cp .env.example .env   # fill SESSION_SECRET, POSTGRES_PASSWORD, provider keys
#   docker compose up -d --build
# A public VPS adds Caddy (deploy/caddy, profile "proxy"): the only public entry, TLS for DOMAIN,
# per-IP limits, no IP logs. The app port is published on localhost only; Postgres and Redis stay
# on the internal network.
name: private-ai

services:
  app:
    build: .
    image: private-ai:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/pai
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    # Metadata-only logs, rotated: at most 3 x 10 MB (stated on /privacy/metadata).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Public VPS only: docker compose --profile proxy up -d
  caddy:
    profiles: [proxy]
    build: deploy/caddy
    image: private-ai-caddy:latest
    restart: unless-stopped
    # Host network: Caddy must see real client IPs for its per-IP limits (docker-proxy would hide them).
    # It listens on 80/443 (TCP, UDP for HTTP/3) and reaches the app on 127.0.0.1:APP_PORT.
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:-} # required; the caddy image exits if it is empty
      APP_PORT: ${APP_PORT:-3000}
    volumes:
      - caddydata:/data # TLS certificates and ACME account
      - caddyconfig:/config
    depends_on:
      app: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pai
      POSTGRES_DB: pai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No statement logging: the schema holds no content, but keep logs minimal anyway.
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_duration_statement=-1"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pai -d pai"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF so quotas and counters survive a Redis restart too. Counters only; no content.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
