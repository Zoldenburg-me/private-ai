name: CI

on:
  pull_request:
  push:
    branches: [main]

# All jobs only read the code; keep the token read-only whatever the repo default is.
permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress; pushes to main always run to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which of the slower jobs a PR needs. On main every job runs, so each merge is still checked in full.
  # A skipped job counts as passed for required status checks.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.diff.outputs.image }}
      proxy: ${{ steps.diff.outputs.proxy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"; echo "proxy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          has() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          # The production image: how it is built, what it installs, and what runs at boot (instrumentation.ts boot checks, migrations, stores).
          echo "image=$(has '^(Dockerfile|\.dockerignore|package(-lock)?\.json|next\.config\.mjs|instrumentation\.ts|middleware\.ts|docker-compose\.yml|migrations/|lib/store/|scripts/smoke-image\.sh|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          # The Caddy proxy for a public VPS (deploy/caddy); hiddensee.app itself runs behind the Cloudflare Tunnel.
          echo "proxy=$(has '^(deploy/caddy/|docker-compose\.yml|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pai
          POSTGRES_PASSWORD: pai
          POSTGRES_DB: pai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pai -d pai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches the Dockerfile NODE_IMAGE major
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Uses the package.json defaults (pai:pai@127.0.0.1:5432/pai_test, redis db 1); the store applies migrations/*.sql itself.
      - run: npm run test:integration
      # The image job runs only when the image changes, so every PR still renders its dynamic pages in the production
      # server here (the same pages scripts/smoke-image.sh checks), against real Postgres/Redis. Throwaway values only.
      - name: Production server renders the main pages
        env:
          PORT: 3000
          HOSTNAME: 127.0.0.1
          DATABASE_URL: postgres://pai:pai@127.0.0.1:5432/pai_test
          REDIS_URL: redis://127.0.0.1:6379/2
          INVITE_ONLY: 1
          WEBAUTHN_RP_ID: localhost
          WEBAUTHN_ORIGIN: http://localhost:3000
          APP_URL: http://localhost:3000
        run: |
          export SESSION_SECRET=$(openssl rand -hex 32) ADMIN_KEY_KEK=$(openssl rand -base64 32)
          echo "::add-mask::$SESSION_SECRET"; echo "::add-mask::$ADMIN_KEY_KEK"
          # Lay out the server the way the Dockerfile does: static assets, public/ and migrations/ next to server.js.
          cp -r .next/static .next/standalone/.next/static && cp -r public migrations .next/standalone/
          node .next/standalone/server.js > server.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:3000/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/health || { echo "health not ok"; tail -40 server.log; exit 1; }
          for p in / /chat /models /privacy/metadata; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$p"); echo "$p $c"
            [ "$c" = 200 ] || { tail -40 server.log; exit 1; }
          done

  proxy:
    needs: changes
    if: needs.changes.outputs.proxy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t pai-caddy deploy/caddy
      - run: docker run --rm -e DOMAIN=chat.example.com pai-caddy caddy validate --config /etc/caddy/Caddyfile
      - name: Caddy refuses to start without DOMAIN
        run: "! docker run --rm pai-caddy"
      - name: Per-IP limit answers 429 on the 61st /api/session request
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 >/dev/null 2>&1 &
          docker run -d --name caddy --network host -e DOMAIN=localhost pai-caddy
          for i in $(seq 30); do curl -sk -o /dev/null https://localhost/ && break; sleep 1; done
          codes=$(for i in $(seq 61); do curl -sk -o /dev/null -w '%{http_code}\n' https://localhost/api/session; done)
          echo "$codes" | sort | uniq -c
          test "$(echo "$codes" | head -60 | grep -c 429)" = 0 && test "$(echo "$codes" | tail -1)" = 429
      # The app service needs an .env file; the local quickstart must not need DOMAIN.
      - run: touch .env
      - run: docker compose --profile proxy config -q
        env: { DOMAIN: chat.example.com, POSTGRES_PASSWORD: ci, SESSION_SECRET: ci }
      - run: docker compose config -q
        env: { POSTGRES_PASSWORD: ci, SESSION_SECRET: ci }

  # Builds the production app image and boots it against real Postgres/Redis (scripts/smoke-image.sh).
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pai
          POSTGRES_PASSWORD: pai
          POSTGRES_DB: pai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pai -d pai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t pai-app .
      - run: scripts/smoke-image.sh
        env:
          IMAGE: pai-app
          PG_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
