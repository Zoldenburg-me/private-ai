name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pai
          POSTGRES_PASSWORD: pai
          POSTGRES_DB: pai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pai -d pai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches Dockerfile NODE_VERSION
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Uses the package.json defaults (pai:pai@127.0.0.1:5432/pai_test, redis db 1); the store applies migrations/*.sql itself.
      - run: npm run test:integration
